D-04: {layer: 2, title: "Raw notes table is not readable; only the ai_mask-ed copy is", expected: {clinician: "denied on raw, allowed on masked", pii_reader: "denied on raw, allowed on masked", outsider: "denied on raw, allowed on masked"}, doc: "https://docs.databricks.com/aws/en/data-governance/unity-catalog/manage-privileges/"}
