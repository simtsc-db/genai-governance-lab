# Test catalogue. One entry per test ID.
# expected: per persona (clinician / pii_reader / outsider) or "admin" for audit-mode tests.
# deck_layer matches the seven layers of the companion deck.
# Status values written to test_results: PASS, FAIL, SKIP (prerequisite missing, or the error didn't name
# the control under test; reason recorded), MANUAL (needs a UI or account-console step; see
# docs/manual-steps.md), INFO (recorded, no verdict), PENDING (evidence logs not in yet).
# The dashboard also shows MISSING for an expected test/persona with no row in the latest suite run.
# Optional keys: personas (when expected doesn't list them), modes (default: admin tests run in audit
# and demo, persona tests in demo), source: evidence (written by lab_evidence, next day).
# Automated MCP tests are T-01/T-02; M-xx IDs are manual steps (docs/manual-steps.md).

P-01: {layer: 1, title: "Workspace metastore region recorded", expected: {admin: "region is the intended one, e.g. ap-southeast-1"}, doc: "https://docs.databricks.com/aws/en/resources/databricks-geos"}
P-02: {layer: 1, title: "IP access lists enabled with at least one allow list", expected: {admin: "enabled, >=1 list"}, doc: "https://docs.databricks.com/aws/en/security/network/front-end/ip-access-list"}
P-03: {layer: 1, title: "Personal access token settings", expected: {admin: "tokens disabled, or a maximum lifetime of at most max_token_days (default 90)"}, doc: "https://docs.databricks.com/aws/en/dev-tools/auth/scope-modifiers"}
P-04: {layer: 1, title: "Serverless egress network policy", expected: {admin: "restricted policy attached (account console)"}, doc: "https://docs.databricks.com/aws/en/security/network/serverless-network-security/network-policies"}
P-05: {layer: 1, title: "Partner-powered AI setting (workspace) recorded", expected: {admin: "value recorded and agreed with security; enforced at account level if required"}, doc: "https://docs.databricks.com/aws/en/databricks-ai/partner-powered"}
P-06: {layer: 1, title: "Enforce data processing within workspace Geography", expected: {admin: "on for workspaces that must stay in-Geo"}, doc: "https://docs.databricks.com/aws/en/resources/designated-services"}
P-07: {layer: 1, title: "Negative test: a cross-Geo-only feature is refused", expected: {admin: "ai_mask 2.0 refused with the Geography / cross-Geo reason when enforcement is on in a region that needs cross-Geo for it"}, doc: "https://docs.databricks.com/aws/en/resources/feature-region-support"}
P-08: {layer: 1, title: "Compliance Security Profile state", expected: {admin: "recorded; decision on CSP for patient-data workspaces documented"}, doc: "https://docs.databricks.com/aws/en/security/privacy/security-profile"}

