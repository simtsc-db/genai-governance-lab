G-01: {layer: 3, title: "Model call without EXECUTE on the model service is denied", expected: {clinician: "allowed", pii_reader: "allowed", outsider: "denied"}, doc: "https://docs.databricks.com/aws/en/ai-gateway/govern-access-to-models-with-grant-policies"}
# G-02: PASS needs ONE decision record that names expected_policy with an ENFORCED deny (not log/monitor) and no
