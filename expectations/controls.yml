C-02: {layer: 6, title: "Budgets with per-user thresholds exist (account)", expected: {admin: "at least one Unity Gateway / Genie budget"}, doc: "https://docs.databricks.com/aws/en/ai-gateway/budgets"}

O-01: {layer: 7, source: evidence, modes: [demo], title: "Genie events of the persona runs are in system.access.audit", expected: {admin: "genieStartConversationMessage succeeded on the lab agent for clinician and PII reader, not for the outsider"}, doc: "https://docs.databricks.com/aws/en/admin/system-tables/audit-logs"}
