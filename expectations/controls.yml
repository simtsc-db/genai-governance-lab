B-01: {layer: 3, title: "Creating a Unity Gateway model service needs CREATE SERVICE on the schema", expected: {clinician: "allowed", pii_reader: "denied", outsider: "denied"}, doc: "https://docs.databricks.com/aws/en/ai-gateway/model-services"}
# B-02 evidence: the docs list CREATE SERVICE on the schema (+ USE CATALOG/USE SCHEMA) as the only privilege, so an
# inline-key custom provider can be created with CREATE SERVICE alone (no connection, no secret); the probe confirms it.
B-02: {layer: 3, title: "Adding an external model provider (BYOK) needs CREATE SERVICE on the schema", expected: {clinician: "allowed", pii_reader: "denied", outsider: "denied"}, doc: "https://docs.databricks.com/aws/en/ai-gateway/model-provider-services"}
B-03: {layer: 5, title: "Creating a connection (needed to register an external MCP server) needs CREATE CONNECTION", expected: {clinician: "denied", pii_reader: "denied", outsider: "denied"}, doc: "https://docs.databricks.com/aws/en/ai-gateway/register-mcp-service"}
# Denials (all persona tests): the error's denial clause must name the privilege under test AND the exact securable
# (e.g. "does not have SELECT on Table <target>", the Genie space ID, the full 3-part service name); else SKIP.
# B-04: a generic 403 that names neither USE CONNECTION nor the connection is SKIP (missing privilege not identifiable).
B-04: {layer: 5, title: "Registering an MCP service needs CREATE SERVICE and USE CONNECTION", expected: {clinician: "denied", pii_reader: "denied", outsider: "denied"}, doc: "https://docs.databricks.com/aws/en/ai-gateway/govern-mcp-service"}
# B-04b: the allowed path. Clinicians hold CREATE SERVICE on the tools schema and USE CONNECTION on the builders' dummy
# connection only. Creation alone is the evidence (the probe never lists tools, so no traffic to the placeholder host).
# B-04b allowed is noted in B-04's evidence, but B-04's verdict is never inferred from it.
B-04b: {layer: 5, title: "An approved builder can register an MCP service on a connection it was granted", expected: {clinician: "allowed", pii_reader: "denied", outsider: "denied"}, doc: "https://docs.databricks.com/aws/en/ai-gateway/register-mcp-service"}
# B-05: expected is the TARGET control (denied). It holds only with the workspace setting Enforce Unity Gateway on
# (B-08): creation then fails with "Creating external model endpoint '<name>' is disabled for this workspace. Please use
# Unity Gateway." PASS needs that clause naming the probe's exact endpoint; a generic 403 is SKIP. With the setting off,
# any persona with workspace access can create one: FAIL, a finding (gaps.md gap 22). Existing endpoints stay queryable.
B-05: {layer: 5, title: "Creating a classic serving endpoint with an external model (route outside Unity Gateway)", expected: {clinician: "denied", pii_reader: "denied", outsider: "denied"}, doc: "https://docs.databricks.com/aws/en/ai-gateway/migrate-to-unity-gateway"}
B-06: {layer: 3, title: "No CREATE SERVICE, CREATE CONNECTION or ALL PRIVILEGES outside the approved builders", expected: {admin: "only approved_builders hold these privileges (MANUAL if the audit identity is not a metastore admin)"}, doc: "https://docs.databricks.com/aws/en/ai-gateway/ai-governance/"}
B-07: {layer: 3, title: "Default access to Databricks-provided models and MCPs (system.ai) recorded", expected: {admin: "recorded; restrict if not every user may use every built-in model and MCP"}, doc: "https://docs.databricks.com/aws/en/ai-gateway/govern-mcp-service"}
# B-08: workspace settings v2 key enforce_ai_gateway_v3_only (undocumented; discovered from workspace settings metadata; best effort; may change without notice; the UI is authoritative). PASS
# does not cover endpoints that already exist: they stay queryable. FAIL when readable and off (B-05 stays open). MANUAL when the
# setting isn't offered (docs: it appears in workspaces with legacy AI Gateway endpoints) or can't be read (needs admin).
B-08: {layer: 3, title: "Enforce Unity Gateway is on (databricks-* pay-per-token endpoints disabled; no NEW external-model or provisioned-throughput serving endpoints outside Unity Gateway; existing ones stay queryable)", expected: {admin: "on (MANUAL if not offered or not readable: Settings > Advanced); then inventory existing external-model / provisioned-throughput endpoints (system.serving.served_entities or the serving endpoint list)"}, doc: "https://docs.databricks.com/aws/en/ai-gateway/migrate-to-unity-gateway"}
# B-09: read-only. The verdict answers only "does an existing legacy route exist right now?" from the endpoint inventory:
# every listed serving endpoint read in full (no cap, bounded retries). FAIL: any external-model or provisioned-throughput
# endpoint (any caller; they stay queryable with Enforce Unity Gateway on). MANUAL: caller not a workspace admin (the
# list API is permission-filtered) or classification incomplete. INFO: other AI endpoints. PASS: admin, complete, none.
# system.serving usage over usage_lookback_days is supplementary evidence only, never part of the verdict: traffic is
# shown only for endpoints with usage tracking on during the window (configure-ai-gateway-endpoints), so absence is not
# proof. Lab-owned probe endpoints are labelled, never excluded.
B-09: {layer: 3, title: "Legacy AI endpoint inventory: no external-model, provisioned-throughput or other AI serving endpoints exist right now", expected: {admin: "none, as a workspace admin with every endpoint classified (PASS); INFO lists other AI endpoints to migrate; MANUAL if non-admin or classification incomplete. Usage history is supplementary"}, doc: "https://docs.databricks.com/aws/en/ai-gateway/migrate-to-unity-gateway", doc_also: "https://docs.databricks.com/aws/en/ai-gateway/configure-ai-gateway-endpoints"}
