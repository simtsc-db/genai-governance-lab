D-06: {layer: 2, title: "ai_mask 1.0 masks names, IDs and phone numbers in free text", expected: {admin: "no NRIC pattern or phone number left in output"}, doc: "https://docs.databricks.com/aws/en/sql/language-manual/functions/ai_mask"}
