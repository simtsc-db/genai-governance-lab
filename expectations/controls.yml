G-02: {layer: 3, title: "The intended service policy blocks a prompt containing an NRIC", expected: {clinician: "blocked", pii_reader: "blocked", outsider: "denied"}, doc: "https://docs.databricks.com/aws/en/data-governance/unity-catalog/service-policies/"}

